<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUTS File Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background: #080b12;
            background-image: radial-gradient(circle at 30% 20%, #0d1a2b, #020406 95%);
        }

        .file-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(8, 13, 24, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(30, 144, 255, 0.15), 0 0 80px rgba(0, 80, 200, 0.08);
            border: 1px solid rgba(50, 150, 255, 0.12);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.5s ease;
        }

        .file-card:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95), 0 0 60px rgba(30, 144, 255, 0.2), 0 0 100px rgba(0, 80, 200, 0.12);
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: -15%;
            left: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(30, 144, 255, 0.15) 0%, transparent 70%);
            filter: blur(70px);
            z-index: 0;
            animation: glowPulse 8s ease-in-out infinite alternate;
        }

        .file-card::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(0, 120, 255, 0.1) 0%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            animation: glowPulse 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes glowPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .file-card>* {
            position: relative;
            z-index: 2;
        }

        /* ===== PASSWORD OVERLAY ===== */
        .password-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: rgba(8, 13, 24, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            transition: opacity 0.5s ease;
        }

        .password-overlay.hidden {
            display: none;
        }

        .password-overlay .lock-icon {
            font-size: 4rem;
            color: #4a8eff;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 30px #1e90ff);
            animation: iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .password-overlay h2 {
            color: #d6e6ff;
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .password-overlay p {
            color: #8aafdf;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            text-align: center;
        }

        .password-input-group {
            display: flex;
            gap: 0.8rem;
            width: 100%;
            max-width: 380px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .password-input-group input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(30, 144, 255, 0.2);
            background: rgba(0, 18, 40, 0.4);
            color: #d6e6ff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .password-input-group input:focus {
            border-color: #1e90ff;
            box-shadow: 0 0 25px rgba(30, 144, 255, 0.15);
        }

        .password-input-group .btn-unlock {
            padding: 0.8rem 2rem;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #1a5bbf, #0b3d8a);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(30, 144, 255, 0.2);
            border: 1px solid rgba(30, 144, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-input-group .btn-unlock:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(30, 144, 255, 0.3);
        }

        .password-error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            min-height: 1.5rem;
        }

        /* ===== HEADER ===== */
        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(30, 144, 255, 0.1);
        }

        .brand {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #b8d8ff, #4a8eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(30, 144, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand i {
            color: #4a8eff;
            font-size: 1.8rem;
            filter: drop-shadow(0 0 15px #1e90ff);
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .lock-status {
            background: rgba(30, 144, 255, 0.1);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #7bbaff;
            border: 1px solid rgba(30, 144, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout {
            background: rgba(255, 70, 70, 0.08);
            border: 1px solid rgba(255, 70, 70, 0.15);
            color: #ff8a8a;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: rgba(255, 70, 70, 0.15);
            border-color: rgba(255, 70, 70, 0.3);
            transform: scale(1.02);
        }

        .file-content {
            display: none;
        }

        .file-content.active {
            display: block;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            align-items: center;
            justify-content: space-between;
        }

        .toolbar-left {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: rgba(0, 18, 40, 0.3);
            border: 1px solid rgba(30, 144, 255, 0.08);
            color: #b0ceff;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(2px);
        }

        .toolbar-btn:hover {
            background: rgba(30, 144, 255, 0.08);
            border-color: rgba(30, 144, 255, 0.2);
            transform: translateY(-1px);
        }

        .toolbar-btn.danger:hover {
            background: rgba(255, 70, 70, 0.1);
            border-color: rgba(255, 70, 70, 0.2);
            color: #ff8a8a;
        }

        .toolbar-btn i {
            color: #4a8eff;
        }

        .toolbar-btn.danger i {
            color: #ff6b6b;
        }

        .toolbar-right {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 18, 40, 0.3);
            border: 1px solid rgba(30, 144, 255, 0.08);
            border-radius: 40px;
            padding: 0.3rem 0.3rem 0.3rem 1rem;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: rgba(30, 144, 255, 0.3);
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.05);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #d6e6ff;
            font-size: 0.85rem;
            outline: none;
            padding: 0.3rem 0;
            width: 140px;
        }

        .search-box input::placeholder {
            color: #5a7fa8;
        }

        .search-box button {
            background: linear-gradient(135deg, #1a5bbf, #0b3d8a);
            border: none;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .search-box button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.2);
        }

        /* ===== PATH ===== */
        .path-bar {
            background: rgba(0, 18, 40, 0.25);
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border: 1px solid rgba(30, 144, 255, 0.06);
            min-height: 3rem;
        }

        .path-bar i {
            color: #4a8eff;
            font-size: 0.9rem;
        }

        .path-bar .path-sep {
            color: #4a6a8a;
        }

        .path-part {
            color: #8aafdf;
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .path-part:hover {
            color: #b3d9ff;
        }

        .path-part.current {
            color: #b3d9ff;
            font-weight: 500;
        }

        /* ===== FILE GRID ===== */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            min-height: 200px;
        }

        .file-item {
            background: rgba(0, 18, 40, 0.2);
            border-radius: 1.5rem;
            padding: 1.2rem 1rem;
            text-align: center;
            border: 1px solid rgba(30, 144, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
        }

        .file-item:hover {
            background: rgba(30, 144, 255, 0.06);
            border-color: rgba(30, 144, 255, 0.15);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .file-item .file-icon {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            display: block;
            filter: drop-shadow(0 0 10px rgba(30, 144, 255, 0.1));
        }

        .file-item .file-icon.folder {
            color: #f0b34b;
        }

        .file-item .file-icon.image {
            color: #6bcb6b;
        }

        .file-item .file-icon.pdf {
            color: #ff6b6b;
        }

        .file-item .file-icon.zip {
            color: #c084fc;
        }

        .file-item .file-icon.code {
            color: #4fc3f7;
        }

        .file-item .file-icon.text {
            color: #81c784;
        }

        .file-item .file-name {
            color: #cde0ff;
            font-size: 0.85rem;
            font-weight: 500;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .file-item .file-size {
            color: #5a7fa8;
            font-size: 0.7rem;
            margin-top: 0.3rem;
            display: block;
        }

        .file-item .file-check {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(30, 144, 255, 0.15);
            background: transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 0.7rem;
        }

        .file-item.selected .file-check {
            background: #1e90ff;
            border-color: #1e90ff;
            color: white;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.3);
        }

        .file-item.selected {
            border-color: #1e90ff;
            background: rgba(30, 144, 255, 0.05);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #5a7fa8;
        }

        .empty-state i {
            font-size: 3rem;
            color: #4a6a8a;
            margin-bottom: 1rem;
            display: block;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(30, 144, 255, 0.06);
            color: #5a7fa8;
            font-size: 0.8rem;
        }

        .status-bar .items-count i {
            color: #4a8eff;
            margin-right: 4px;
        }

        .status-bar .storage-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .storage-bar {
            width: 120px;
            height: 4px;
            background: rgba(30, 144, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .storage-bar .fill {
            height: 100%;
            width: 42%;
            background: linear-gradient(90deg, #1e90ff, #4a8eff);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1.5rem;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: rgba(8, 13, 24, 0.95);
            border-radius: 2rem;
            padding: 2rem 2.5rem;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(30, 144, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .modal h3 {
            color: #d6e6ff;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal h3 i {
            color: #4a8eff;
        }

        .modal p {
            color: #8aafdf;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }

        .modal input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(30, 144, 255, 0.15);
            background: rgba(0, 18, 40, 0.4);
            color: #d6e6ff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 0.8rem;
        }

        .modal input:focus {
            border-color: #1e90ff;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.1);
        }

        .modal input::placeholder {
            color: #5a7fa8;
        }

        .modal .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }

        .modal .modal-actions button {
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #8aafdf;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .modal .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .modal .modal-actions .btn-confirm {
            background: linear-gradient(135deg, #1a5bbf, #0b3d8a);
            color: white;
            border: 1px solid rgba(30, 144, 255, 0.3);
            box-shadow: 0 0 25px rgba(30, 144, 255, 0.15);
        }

        .modal .modal-actions .btn-confirm:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(30, 144, 255, 0.25);
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(8, 13, 24, 0.95);
            backdrop-filter: blur(12px);
            padding: 1rem 1.8rem;
            border-radius: 2rem;
            border: 1px solid rgba(30, 144, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            color: #d6e6ff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification i {
            color: #4a8eff;
            font-size: 1.2rem;
        }

        .notification.error i {
            color: #ff6b6b;
        }

        .notification.success i {
            color: #6bcb6b;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .file-card {
                padding: 1.6rem;
                border-radius: 2rem;
            }
            .brand {
                font-size: 1.5rem;
            }
            .file-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.8rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar-left {
                justify-content: center;
                flex-wrap: wrap;
            }
            .toolbar-right {
                justify-content: center;
            }
            .search-box input {
                width: 100px;
            }
            .password-overlay h2 {
                font-size: 1.2rem;
            }
            .password-input-group input {
                min-width: 150px;
            }
            .modal {
                padding: 1.5rem;
            }
            .notification {
                right: 1rem;
                left: 1rem;
                bottom: 1rem;
            }
        }

        @media (max-width: 400px) {
            .file-card {
                padding: 1rem;
            }
            .file-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            .file-item {
                padding: 0.8rem 0.6rem;
            }
            .file-item .file-icon {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NOTIFICATION ===== -->
    <div class="notification" id="notification">
        <i class="fas fa-info-circle"></i>
        <span id="notifMessage">Pesan</span>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle"><i class="fas fa-folder-plus"></i> Buat Folder</h3>
            <p id="modalDesc">Masukkan nama folder baru</p>
            <input type="text" id="modalInput" placeholder="Nama..." />
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Batal</button>
                <button class="btn-confirm" id="modalConfirm">Buat</button>
            </div>
        </div>
    </div>

    <!-- ===== MAIN CARD ===== -->
    <div class="file-card" id="fileCard">

        <!-- PASSWORD OVERLAY -->
        <div class="password-overlay" id="passwordOverlay">
            <div class="lock-icon"><i class="fas fa-lock"></i></div>
            <h2>🔐 File Manager</h2>
            <p>Masukkan password untuk mengakses file manager</p>
            <div class="password-input-group">
                <input type="password" id="passwordInput" placeholder="Masukkan password..." autofocus />
                <button class="btn-unlock" id="unlockBtn"><i class="fas fa-unlock"></i> Buka</button>
            </div>
            <div class="password-error" id="passwordError"></div>
        </div>

        <!-- HEADER -->
        <div class="file-header">
            <div class="brand"><i class="fas fa-folder-open"></i> NUTS Files</div>
            <div class="header-actions">
                <div class="lock-status" id="lockStatus"><i class="fas fa-lock"></i> Terkunci</div>
                <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            </div>
        </div>

        <!-- FILE CONTENT -->
        <div class="file-content" id="fileContent">

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="toolbar-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Kembali</button>
                    <button class="toolbar-btn" id="newFolderBtn"><i class="fas fa-folder-plus"></i> Folder Baru</button>
                    <button class="toolbar-btn" id="newFileBtn"><i class="fas fa-file-plus"></i> File Baru</button>
                    <button class="toolbar-btn danger" id="deleteBtn"><i class="fas fa-trash"></i> Hapus</button>
                </div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <input type="text" placeholder="Cari file..." id="searchInput" />
                        <button id="searchBtn"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>

            <!-- PATH -->
            <div class="path-bar" id="pathBar">
                <i class="fas fa-home"></i>
                <span class="path-part current" data-path="root">root</span>
            </div>

            <!-- FILE GRID -->
            <div class="file-grid" id="fileGrid"></div>

            <!-- STATUS BAR -->
            <div class="status-bar">
                <div class="items-count" id="itemsCount"><i class="fas fa-folder"></i> 0 folder · <i class="fas fa-file"></i> 0 file</div>
                <div class="storage-info">
                    <span>Gunakan 4.2 GB dari 10 GB</span>
                    <div class="storage-bar"><div class="fill" style="width: 42%;"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. PASSWORD SYSTEM
        // ============================================================
        const PASSWORD = 'admin123';

        const overlay = document.getElementById('passwordOverlay');
        const fileContent = document.getElementById('fileContent');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const passwordError = document.getElementById('passwordError');
        const logoutBtn = document.getElementById('logoutBtn');
        const lockStatus = document.getElementById('lockStatus');

        // Cek session di localStorage
        let isAuthenticated = localStorage.getItem('fm_auth') === 'true';

        function unlock() {
            const inputPass = passwordInput.value.trim();
            if (inputPass === PASSWORD) {
                isAuthenticated = true;
                localStorage.setItem('fm_auth', 'true');
                overlay.classList.add('hidden');
                fileContent.classList.add('active');
                lockStatus.innerHTML = '<i class="fas fa-unlock"></i> Terbuka';
                lockStatus.style.borderColor = 'rgba(30, 144, 255, 0.3)';
                passwordError.textContent = '';
                passwordInput.value = '';
                render();
            } else {
                passwordError.textContent = '❌ Password salah, coba lagi!';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function lock() {
            isAuthenticated = false;
            localStorage.removeItem('fm_auth');
            overlay.classList.remove('hidden');
            fileContent.classList.remove('active');
            lockStatus.innerHTML = '<i class="fas fa-lock"></i> Terkunci';
            lockStatus.style.borderColor = 'rgba(30, 144, 255, 0.15)';
            passwordInput.value = '';
            passwordInput.focus();
        }

        unlockBtn.addEventListener('click', unlock);
        passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
        logoutBtn.addEventListener('click', lock);

        // Auto-login if session exists
        if (isAuthenticated) {
            overlay.classList.add('hidden');
            fileContent.classList.add('active');
            lockStatus.innerHTML = '<i class="fas fa-unlock"></i> Terbuka';
            lockStatus.style.borderColor = 'rgba(30, 144, 255, 0.3)';
        }

        // ============================================================
        // 2. FILE SYSTEM (LocalStorage)
        // ============================================================
        let currentPath = ['root'];
        let selectedItems = new Set();
        let searchQuery = '';

        // Default file structure
        const DEFAULT_FILES = {
            'root': {
                type: 'folder',
                children: {
                    'Proyek Website': { type: 'folder', children: {
                        'index.html': { type: 'file', size: '8 KB', ext: 'code' },
                        'style.css': { type: 'file', size: '4 KB', ext: 'code' },
                        'script.js': { type: 'file', size: '6 KB', ext: 'code' },
                    } },
                    'Assets': { type: 'folder', children: {
                        'logo.png': { type: 'file', size: '120 KB', ext: 'image' },
                        'banner.jpg': { type: 'file', size: '450 KB', ext: 'image' },
                    } },
                    'README.md': { type: 'file', size: '3 KB', ext: 'text' },
                    'screenshot.png': { type: 'file', size: '2.4 MB', ext: 'image' },
                }
            }
        };

        function loadFileSystem() {
            const data = localStorage.getItem('nuts_files');
            if (data) {
                try {
                    return JSON.parse(data);
                } catch (e) {
                    return JSON.parse(JSON.stringify(DEFAULT_FILES));
                }
            }
            return JSON.parse(JSON.stringify(DEFAULT_FILES));
        }

        function saveFileSystem(fs) {
            localStorage.setItem('nuts_files', JSON.stringify(fs));
        }

        let fileSystem = loadFileSystem();

        // ============================================================
        // 3. HELPER FUNCTIONS
        // ============================================================
        function getNode(path) {
            let node = fileSystem;
            for (const part of path) {
                if (part === 'root') {
                    node = fileSystem['root'];
                } else {
                    if (node.children && node.children[part]) {
                        node = node.children[part];
                    } else {
                        return null;
                    }
                }
            }
            return node;
        }

        function getCurrentNode() {
            return getNode(currentPath);
        }

        function getChildren() {
            const node = getCurrentNode();
            if (node && node.children) {
                return node.children;
            }
            return {};
        }

        function getFileIcon(ext) {
            const icons = {
                folder: 'fas fa-folder',
                image: 'fas fa-file-image',
                pdf: 'fas fa-file-pdf',
                zip: 'fas fa-file-archive',
                code: 'fas fa-file-code',
                text: 'fas fa-file-alt',
                video: 'fas fa-file-video',
                audio: 'fas fa-file-audio',
            };
            return icons[ext] || 'fas fa-file';
        }

        function getFileColor(ext) {
            const colors = {
                folder: 'folder',
                image: 'image',
                pdf: 'pdf',
                zip: 'zip',
                code: 'code',
                text: 'text',
                video: 'video',
                audio: 'audio',
            };
            return colors[ext] || '';
        }

        // ============================================================
        // 4. RENDER
        // ============================================================
        function render() {
            if (!isAuthenticated) return;

            const grid = document.getElementById('fileGrid');
            const children = getChildren();
            const keys = Object.keys(children);

            let filteredKeys = keys;
            if (searchQuery) {
                filteredKeys = keys.filter(k => k.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            if (filteredKeys.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>${searchQuery ? 'Tidak ada hasil untuk "' + searchQuery + '"' : 'Folder kosong'}</p>
                    </div>
                `;
            } else {
                let html = '';
                const sorted = filteredKeys.sort((a, b) => {
                    const aIsFolder = children[a].type === 'folder';
                    const bIsFolder = children[b].type === 'folder';
                    if (aIsFolder && !bIsFolder) return -1;
                    if (!aIsFolder && bIsFolder) return 1;
                    return a.localeCompare(b);
                });

                for (const name of sorted) {
                    const item = children[name];
                    const isFolder = item.type === 'folder';
                    const ext = item.ext || 'text';
                    const iconClass = getFileIcon(isFolder ? 'folder' : ext);
                    const colorClass = getFileColor(isFolder ? 'folder' : ext);
                    const size = isFolder ? Object.keys(item.children).length + ' item' : item.size || '0 KB';
                    const selected = selectedItems.has(name) ? 'selected' : '';

                    html += `
                        <div class="file-item ${selected}" data-name="${name}" data-type="${isFolder ? 'folder' : 'file'}">
                            <span class="file-check"><i class="fas fa-check"></i></span>
                            <span class="file-icon ${colorClass}"><i class="${iconClass}"></i></span>
                            <span class="file-name">${name}</span>
                            <span class="file-size">${size}</span>
                        </div>
                    `;
                }
                grid.innerHTML = html;
            }

            updatePath();
            updateStatus();
        }

        function updatePath() {
            const pathBar = document.getElementById('pathBar');
            let html = '<i class="fas fa-home"></i> ';
            const parts = currentPath;
            for (let i = 0; i < parts.length; i++) {
                if (i > 0) html += '<span class="path-sep"> / </span>';
                const isLast = i === parts.length - 1;
                html += `<span class="path-part ${isLast ? 'current' : ''}" data-index="${i}">${parts[i]}</span>`;
            }
            pathBar.innerHTML = html;

            document.querySelectorAll('.path-part').forEach(el => {
                el.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    currentPath = currentPath.slice(0, index + 1);
                    selectedItems.clear();
                    render();
                });
            });
        }

        function updateStatus() {
            const children = getChildren();
            const keys = Object.keys(children);
            let folders = 0,
                files = 0;
            for (const key of keys) {
                if (children[key].type === 'folder') folders++;
                else files++;
            }
            document.getElementById('itemsCount').innerHTML =
                `<i class="fas fa-folder"></i> ${folders} folder · <i class="fas fa-file"></i> ${files} file`;
        }

        // ============================================================
        // 5. FILE ITEM EVENTS
        // ============================================================
        document.getElementById('fileGrid').addEventListener('click', function(e) {
            const item = e.target.closest('.file-item');
            if (!item) return;

            const name = item.dataset.name;
            const type = item.dataset.type;

            if (e.target.closest('.file-check')) {
                if (selectedItems.has(name)) {
                    selectedItems.delete(name);
                    item.classList.remove('selected');
                } else {
                    selectedItems.add(name);
                    item.classList.add('selected');
                }
                return;
            }

            if (type === 'folder') {
                // Double click handler
                return;
            }

            if (selectedItems.has(name)) {
                selectedItems.delete(name);
                item.classList.remove('selected');
            } else {
                selectedItems.add(name);
                item.classList.add('selected');
            }
        });

        document.getElementById('fileGrid').addEventListener('dblclick', function(e) {
            const item = e.target.closest('.file-item');
            if (!item) return;
            const name = item.dataset.name;
            const type = item.dataset.type;

            if (type === 'folder') {
                const children = getChildren();
                if (children[name] && children[name].type === 'folder') {
                    currentPath.push(name);
                    selectedItems.clear();
                    render();
                    showNotification('📂 Masuk ke folder "' + name + '"', 'success');
                }
            } else {
                showNotification('📄 Membuka file: ' + name + ' (Preview tidak tersedia)', '');
            }
        });

        // ============================================================
        // 6. TOOLBAR ACTIONS
        // ============================================================

        document.getElementById('backBtn').addEventListener('click', function() {
            if (currentPath.length > 1) {
                currentPath.pop();
                selectedItems.clear();
                render();
                showNotification('⬅️ Kembali', '');
            } else {
                showNotification('📁 Sudah di root', 'error');
            }
        });

        document.getElementById('newFolderBtn').addEventListener('click', function() {
            openModal('Buat Folder', 'Masukkan nama folder baru', 'fas fa-folder-plus', 'Buat', function(name) {
                const children = getChildren();
                if (children[name]) {
                    showNotification('⚠️ Nama "' + name + '" sudah ada!', 'error');
                    return false;
                }
                children[name] = { type: 'folder', children: {} };
                saveFileSystem(fileSystem);
                render();
                showNotification('📁 Folder "' + name + '" berhasil dibuat', 'success');
                return true;
            });
        });

        document.getElementById('newFileBtn').addEventListener('click', function() {
            openModal('Buat File', 'Masukkan nama file (dengan ekstensi)', 'fas fa-file-plus', 'Buat', function(name) {
                const children = getChildren();
                if (children[name]) {
                    showNotification('⚠️ File "' + name + '" sudah ada!', 'error');
                    return false;
                }
                const ext = name.split('.').pop().toLowerCase();
                const extMap = {
                    'png': 'image', 'jpg': 'image', 'jpeg': 'image', 'gif': 'image', 'svg': 'image',
                    'pdf': 'pdf',
                    'zip': 'zip', 'rar': 'zip', '7z': 'zip',
                    'html': 'code', 'css': 'code', 'js': 'code', 'php': 'code', 'json': 'code',
                    'txt': 'text', 'md': 'text',
                    'mp4': 'video', 'mp3': 'audio',
                };
                const fileExt = extMap[ext] || 'text';
                children[name] = { type: 'file', size: '1 KB', ext: fileExt };
                saveFileSystem(fileSystem);
                render();
                showNotification('📄 File "' + name + '" berhasil dibuat', 'success');
                return true;
            });
        });

        document.getElementById('deleteBtn').addEventListener('click', function() {
            if (selectedItems.size === 0) {
                showNotification('⚠️ Pilih file/folder terlebih dahulu!', 'error');
                return;
            }

            const names = Array.from(selectedItems);
            const children = getChildren();

            if (confirm(`Hapus ${names.length} item yang dipilih?`)) {
                for (const name of names) {
                    if (children[name]) {
                        delete children[name];
                    }
                }
                selectedItems.clear();
                saveFileSystem(fileSystem);
                render();
                showNotification('🗑️ ' + names.length + ' item berhasil dihapus', 'success');
            }
        });

        document.getElementById('searchBtn').addEventListener('click', function() {
            const input = document.getElementById('searchInput');
            searchQuery = input.value.trim();
            render();
            if (searchQuery) {
                showNotification('🔍 Mencari: "' + searchQuery + '"', '');
            }
        });

        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            if (this.value === '' && searchQuery !== '') {
                searchQuery = '';
                render();
            }
        });

        // ============================================================
        // 7. MODAL SYSTEM
        // ============================================================
        let modalCallback = null;

        function openModal(title, desc, icon, confirmText, callback) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').innerHTML = `<i class="${icon}"></i> ${title}`;
            document.getElementById('modalDesc').textContent = desc;
            document.getElementById('modalInput').value = '';
            document.getElementById('modalInput').placeholder = 'Nama...';
            document.getElementById('modalConfirm').textContent = confirmText;
            modalCallback = callback;
            overlay.classList.add('show');
            setTimeout(() => document.getElementById('modalInput').focus(), 100);
        }

        document.getElementById('modalCancel').addEventListener('click', function() {
            document.getElementById('modalOverlay').classList.remove('show');
            modalCallback = null;
        });

        document.getElementById('modalConfirm').addEventListener('click', function() {
            const input = document.getElementById('modalInput');
            const name = input.value.trim();
            if (!name) {
                showNotification('⚠️ Nama tidak boleh kosong!', 'error');
                return;
            }
            if (modalCallback) {
                const result = modalCallback(name);
                if (result !== false) {
                    document.getElementById('modalOverlay').classList.remove('show');
                    modalCallback = null;
                }
            }
        });

        document.getElementById('modalInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('modalConfirm').click();
            if (e.key === 'Escape') document.getElementById('modalCancel').click();
        });

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
                modalCallback = null;
            }
        });

        // ============================================================
        // 8. NOTIFICATION
        // ============================================================
        let notifTimeout = null;

        function showNotification(message, type = '') {
            const notif = document.getElementById('notification');
            const span = document.getElementById('notifMessage');
            span.textContent = message;
            notif.className = 'notification ' + type;
            notif.classList.add('show');

            clearTimeout(notifTimeout);
            notifTimeout = setTimeout(() => {
                notif.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 9. INIT
        // ============================================================
        if (isAuthenticated) {
            render();
        }

        console.log('🔐 Password: admin123');
        console.log('📁 Data disimpan di LocalStorage browser');
    </script>
</body>
</html>
